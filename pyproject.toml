# Created by Caleb M. Irvine for use by Moto Reloaded

[project]
name = "motoreloaded"
version = "0.1.0"
description = "Moto Reloaded Gear Intake Checker — photo coverage and damage disclosure scoring workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "open-clip-torch>=2.29.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "qrcode[pil]>=8.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
